[package]
name = "summdb-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "summdb-server"
path = "src/main.rs"

[dependencies]
summdb-core = { path = "../summdb-core" }
summdb-storage = { path = "../summdb-storage" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
zstd = "0.13"
