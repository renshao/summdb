<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>summdb</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { padding: 1rem 2rem; }
    h1.logo { letter-spacing: 0.15em; font-size: 1.8rem; margin: 0 0 1rem; }
    .repo-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.6rem 1rem;
      margin-bottom: 1.2rem;
      background: var(--pico-card-sectioning-background-color);
      border-radius: 6px;
    }
    .repo-bar form { margin: 0; flex: 0 0 320px; }
    .repo-bar input { margin: 0; }
    .repo-bar .stats {
      display: flex;
      gap: 1.5rem;
      align-items: baseline;
      flex: 1;
    }
    .repo-bar .stat { display: flex; flex-direction: column; }
    .repo-bar .stat small { color: var(--pico-muted-color); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .repo-bar .stat strong { font-size: 1.1rem; font-family: var(--pico-font-family-monospace); }
    .layout { display: grid; grid-template-columns: 160px 1fr; gap: 2rem; align-items: start; }
    .nav { display: flex; flex-direction: column; gap: 0.2rem; }
    .nav-item {
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      color: var(--pico-color);
      text-decoration: none;
      font-weight: 500;
    }
    .nav-item:hover { background: var(--pico-secondary-background); }
    .nav-item.active { background: var(--pico-primary); color: var(--pico-primary-inverse); }
    .tags-view { display: grid; grid-template-columns: 320px 1fr; gap: 2rem; align-items: start; }
    .layers-view { display: flex; flex-direction: column; gap: 1.5rem; }
    .layers-table { width: 100%; font-size: 0.85rem; }
    .layers-table th, .layers-table td { padding: 0.4rem 0.6rem; vertical-align: top; }
    .layers-table th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--pico-muted-color); }
    .layers-table td.digest { font-family: var(--pico-font-family-monospace); word-break: break-all; }
    .layers-table td.digest a { color: var(--pico-primary); text-decoration: none; cursor: pointer; }
    .layers-table td.digest a:hover { text-decoration: underline; }
    .layers-table td.num { font-family: var(--pico-font-family-monospace); text-align: right; white-space: nowrap; }
    .layers-table td.tags { line-height: 1.6; }
    .tag-item {
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .tag-item:hover { background: var(--pico-secondary-background); }
    .tag-item.active { background: var(--pico-primary); color: var(--pico-primary-inverse); }
    .layer {
      display: block;
      font-family: var(--pico-font-family-monospace);
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      background: var(--pico-card-sectioning-background-color);
      margin: 0.15rem 0;
      border-radius: 4px;
      word-break: break-all;
      color: var(--pico-color);
      text-decoration: none;
      cursor: pointer;
    }
    .layer:hover {
      background: var(--pico-secondary-background);
      text-decoration: underline;
    }
    .layer.active {
      border-left: 3px solid var(--pico-primary);
      padding-left: calc(0.6rem - 3px);
    }
    .child {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: baseline;
      font-family: var(--pico-font-family-monospace);
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      background: var(--pico-card-sectioning-background-color);
      margin: 0.15rem 0;
      border-radius: 4px;
      color: var(--pico-color);
      text-decoration: none;
      cursor: pointer;
      word-break: break-all;
    }
    .child:hover {
      background: var(--pico-secondary-background);
      text-decoration: underline;
    }
    .child .child-digest { color: var(--pico-muted-color); }
    .tag-chip {
      display: inline-block;
      font-family: var(--pico-font-family-monospace);
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      margin: 0.15rem 0.2rem 0 0;
      background: var(--pico-secondary-background);
      border-radius: 4px;
    }
    .manifest-row {
      padding: 0.5rem 0.6rem;
      margin: 0.3rem 0;
      background: var(--pico-card-sectioning-background-color);
      border-radius: 4px;
    }
    .manifest-row .platform { color: var(--pico-muted-color); }
    .right-col { display: flex; flex-direction: column; gap: 1rem; }
    .muted { color: var(--pico-muted-color); font-style: italic; }
    code { word-break: break-all; }
    article p { margin-bottom: 0.6rem; }
  </style>
</head>
<body x-data="summdb()">
  <h1 class="logo">summdb</h1>

  <div class="repo-bar">
    <form @submit.prevent="loadTags()">
      <input x-model="repo" type="text" placeholder="repo (e.g. library/ubuntu)" autofocus
             list="repo-suggestions" autocomplete="off"
             @input="filterSuggestions()">
      <datalist id="repo-suggestions">
        <template x-for="r in filteredRepos" :key="r">
          <option :value="r"></option>
        </template>
      </datalist>
    </form>
    <div class="stats">
      <template x-if="stats">
        <div class="stat">
          <small>repo</small>
          <strong x-text="stats.repo"></strong>
        </div>
      </template>
      <template x-if="stats">
        <div class="stat">
          <small>manifests</small>
          <strong x-text="stats.manifests.toLocaleString()"></strong>
        </div>
      </template>
      <template x-if="stats">
        <div class="stat">
          <small>tags</small>
          <strong x-text="stats.tags.toLocaleString()"></strong>
        </div>
      </template>
      <template x-if="stats">
        <div class="stat">
          <small>size</small>
          <strong x-text="formatBytes(stats.size)"></strong>
        </div>
      </template>
      <template x-if="!stats">
        <span class="muted">no repo selected</span>
      </template>
    </div>
  </div>

  <div class="layout">
    <nav class="nav">
      <a class="nav-item" :class="{ active: view === 'tags' }"
         href="#" @click.prevent="setView('tags')">Tags</a>
      <a class="nav-item" :class="{ active: view === 'layers' }"
         href="#" @click.prevent="setView('layers')">Layers</a>
    </nav>

    <div x-show="view === 'tags'" class="tags-view">
    <section>
      <p class="muted" x-show="status" x-text="status"></p>
      <template x-for="t in tags.slice(0, 50)" :key="t.tag">
        <div class="tag-item"
             :class="{ active: activeDigest === t.digest }"
             @click="loadManifest(t.digest)">
          <strong x-text="t.tag"></strong>
          <small x-text="shortDigest(t.digest)"></small>
        </div>
      </template>
    </section>

    <div class="right-col">
      <article>
        <template x-if="!manifest">
          <p class="muted">select a tag to view its manifest</p>
        </template>

        <template x-if="manifest">
          <div>
            <p><small>digest</small><br><code x-text="manifest.digest"></code></p>
            <p><small>repo</small><br><span x-text="manifest.repo"></span></p>
            <template x-if="manifest.parent">
              <p>
                <small>parent</small><br>
                <a href="#" @click.prevent="loadManifest(manifest.parent.digest)">
                  <code x-text="manifest.parent.digest"></code>
                </a>
              </p>
            </template>
            <p><small>media type</small><br><code x-text="manifest.media_type"></code></p>
            <p><small>total layer size</small><br>
              <span x-text="formatBytes(manifest.total_layer_size) + ' (' + manifest.total_layer_size.toLocaleString() + ' bytes)'"></span>
            </p>
            <p><small>platform</small><br>
              <span x-text="manifest.platform ? manifest.platform.os + '/' + manifest.platform.arch : '—'"></span>
            </p>
            <p>
              <small>raw json</small><br>
              <a :href="`/v1/repos/${encodeURIComponent(manifest.repo)}/manifests/${encodeURIComponent(manifest.digest)}/body`"
                 target="_blank" rel="noopener">view body</a>
            </p>
            <template x-if="manifest.tags && manifest.tags.length">
              <p>
                <small x-text="'tags (' + manifest.tags.length + ')'"></small><br>
                <template x-for="t in manifest.tags" :key="t">
                  <span class="tag-chip" x-text="t"></span>
                </template>
              </p>
            </template>
            <template x-if="manifest.children && manifest.children.length">
              <div>
                <p><small x-text="'sub-manifests (' + manifest.children.length + ')'"></small></p>
                <template x-for="c in manifest.children" :key="c.digest">
                  <a href="#" class="child" @click.prevent="loadManifest(c.digest)">
                    <strong x-text="c.platform ? c.platform.os + '/' + c.platform.arch : 'unknown platform'"></strong>
                    <span class="child-digest" x-text="c.digest"></span>
                  </a>
                </template>
              </div>
            </template>
            <template x-if="!(manifest.children && manifest.children.length)">
              <div>
                <p><small x-text="'layers (' + manifest.layers.length + ')'"></small></p>
                <template x-if="manifest.layers.length === 0">
                  <p class="muted">none</p>
                </template>
                <template x-for="l in manifest.layers" :key="l">
                  <a href="#" class="layer" :class="{ active: selectedLayer === l }"
                     @click.prevent="loadLayer(l)" x-text="l"></a>
                </template>
              </div>
            </template>
          </div>
        </template>
      </article>

      <article x-show="selectedLayer">
        <p><small>layer</small><br><code x-text="selectedLayer"></code></p>
        <p class="muted" x-text="layerStatus"></p>
        <template x-for="m in layerManifests" :key="m.repo + ':' + m.digest">
          <div class="manifest-row">
            <strong x-text="m.repo"></strong>
            <span class="platform" x-show="m.platform"
                  x-text="m.platform ? ' · ' + m.platform.os + '/' + m.platform.arch : ''"></span>
            <br>
            <small><code x-text="m.digest"></code></small><br>
            <small class="muted" x-text="m.media_type"></small>
            <template x-if="m.displayTags && m.displayTags.length">
              <div style="margin-top: 0.3rem">
                <small class="muted" x-text="m.tagsSource === 'parent' ? 'parent tags:' : 'tags:'"></small>
                <template x-for="t in m.displayTags" :key="t">
                  <span class="tag-chip" x-text="t"></span>
                </template>
              </div>
            </template>
          </div>
        </template>
      </article>
    </div>
    </div>

    <div x-show="view === 'layers'" class="layers-view">
      <template x-if="!stats">
        <p class="muted">select a repo to view its layers</p>
      </template>
      <template x-if="stats && layersStatus">
        <p class="muted" x-text="layersStatus"></p>
      </template>
      <template x-if="stats && layersData">
        <div>
          <article>
            <h3 style="margin: 0 0 0.5rem">Top 20 layers by size</h3>
            <table class="layers-table">
              <thead>
                <tr>
                  <th style="width: 40%">digest</th>
                  <th style="width: 10%">size</th>
                  <th>tags</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="l in layersData.by_size" :key="'s:' + l.digest">
                  <tr>
                    <td class="digest">
                      <a @click.prevent="openLayer(l.digest)" href="#"
                         x-text="l.digest"></a>
                    </td>
                    <td class="num" x-text="formatBytes(l.size)"></td>
                    <td class="tags">
                      <template x-for="t in l.tags" :key="'s:' + l.digest + ':' + t">
                        <span class="tag-chip" x-text="t"></span>
                      </template>
                      <span class="muted" x-show="!l.tags.length">—</span>
                    </td>
                  </tr>
                </template>
                <template x-if="!layersData.by_size.length">
                  <tr><td colspan="3" class="muted">no layers</td></tr>
                </template>
              </tbody>
            </table>
          </article>

          <article>
            <h3 style="margin: 0 0 0.5rem">Top 20 layers by referencing manifests</h3>
            <table class="layers-table">
              <thead>
                <tr>
                  <th style="width: 40%">digest</th>
                  <th style="width: 10%">manifests</th>
                  <th>tags</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="l in layersData.by_manifest_count" :key="'m:' + l.digest">
                  <tr>
                    <td class="digest">
                      <a @click.prevent="openLayer(l.digest)" href="#"
                         x-text="l.digest"></a>
                    </td>
                    <td class="num" x-text="l.manifest_count.toLocaleString()"></td>
                    <td class="tags">
                      <template x-for="t in l.tags" :key="'m:' + l.digest + ':' + t">
                        <span class="tag-chip" x-text="t"></span>
                      </template>
                      <span class="muted" x-show="!l.tags.length">—</span>
                    </td>
                  </tr>
                </template>
                <template x-if="!layersData.by_manifest_count.length">
                  <tr><td colspan="3" class="muted">no layers</td></tr>
                </template>
              </tbody>
            </table>
          </article>
        </div>
      </template>
    </div>
  </div>

  <script>
    function summdb() {
      return {
        repo: '',
        allRepos: [],
        filteredRepos: [],
        tags: [],
        stats: null,
        manifest: null,
        activeDigest: null,
        status: '',
        selectedLayer: null,
        layerManifests: [],
        layerStatus: '',
        view: 'tags',
        layersData: null,
        layersStatus: '',
        async init() {
          try {
            const r = await fetch('/v1/repos');
            if (r.ok) this.allRepos = await r.json();
          } catch (_) {}
          this.filteredRepos = this.allRepos;
        },
        filterSuggestions() {
          const q = this.repo.toLowerCase();
          this.filteredRepos = q
            ? this.allRepos.filter(r => r.toLowerCase().includes(q))
            : this.allRepos;
        },
        async loadTags() {
          if (!this.repo.trim()) return;
          this.tags = [];
          this.stats = null;
          this.manifest = null;
          this.activeDigest = null;
          this.selectedLayer = null;
          this.layerManifests = [];
          this.layersData = null;
          this.layersStatus = '';
          this.status = 'loading…';
          try {
            const [tagsRes, statsRes] = await Promise.all([
              fetch(`/v1/repos/${encodeURIComponent(this.repo)}/tags`),
              fetch(`/v1/repos/${encodeURIComponent(this.repo)}/stats`),
            ]);
            if (!tagsRes.ok) throw new Error(`${tagsRes.status} ${tagsRes.statusText}`);
            this.tags = await tagsRes.json();
            if (statsRes.ok) this.stats = await statsRes.json();
            const more = this.tags.length > 50 ? ' (showing 50)' : '';
            this.status = `${this.tags.length} tag${this.tags.length === 1 ? '' : 's'}${more}`;
            if (this.view === 'layers') this.loadLayers();
          } catch (e) {
            this.status = `error: ${e.message}`;
          }
        },
        setView(v) {
          this.view = v;
          if (v === 'layers' && this.stats && !this.layersData && !this.layersStatus.startsWith('loading')) {
            this.loadLayers();
          }
        },
        async loadLayers() {
          if (!this.repo.trim()) return;
          this.layersData = null;
          this.layersStatus = 'loading…';
          try {
            const r = await fetch(`/v1/repos/${encodeURIComponent(this.repo)}/layers?limit=20`);
            if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
            this.layersData = await r.json();
            this.layersStatus = '';
          } catch (e) {
            this.layersStatus = `error: ${e.message}`;
          }
        },
        openLayer(digest) {
          this.view = 'tags';
          this.loadLayer(digest);
        },
        async loadManifest(digest) {
          this.activeDigest = digest;
          this.manifest = null;
          try {
            const r = await fetch(
              `/v1/repos/${encodeURIComponent(this.repo)}/manifests/${encodeURIComponent(digest)}`
            );
            if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
            this.manifest = await r.json();
          } catch (e) {
            this.status = `error: ${e.message}`;
          }
        },
        async loadLayer(digest) {
          this.selectedLayer = digest;
          this.layerManifests = [];
          this.layerStatus = 'loading…';
          try {
            const r = await fetch(`/v1/layers/${encodeURIComponent(digest)}/manifests`);
            if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
            const manifests = await r.json();
            this.layerManifests = await Promise.all(manifests.map(m => this.enrichTags(m)));
            const n = this.layerManifests.length;
            this.layerStatus = `${n} manifest${n === 1 ? '' : 's'} include this layer`;
          } catch (e) {
            this.layerStatus = `error: ${e.message}`;
          }
        },
        shortDigest(d) {
          return d.startsWith('sha256:') ? d.slice(7, 19) : d.slice(0, 12);
        },
        formatBytes(n) {
          if (!n) return '0 B';
          const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
          let i = 0, x = n;
          while (x >= 1024 && i < units.length - 1) { x /= 1024; i++; }
          return `${x.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
        },
        async enrichTags(m) {
          if (m.tags && m.tags.length) {
            return { ...m, displayTags: m.tags, tagsSource: 'self' };
          }
          if (m.parent) {
            try {
              const r = await fetch(
                `/v1/repos/${encodeURIComponent(m.parent.repo)}/manifests/${encodeURIComponent(m.parent.digest)}`
              );
              if (r.ok) {
                const parent = await r.json();
                if (parent.tags && parent.tags.length) {
                  return { ...m, displayTags: parent.tags, tagsSource: 'parent' };
                }
              }
            } catch (_) { /* swallow per-row failures */ }
          }
          return { ...m, displayTags: [], tagsSource: null };
        }
      };
    }
  </script>
</body>
</html>
