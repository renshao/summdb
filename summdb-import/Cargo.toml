[package]
name = "summdb-import"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "summdb-import"
path = "src/main.rs"

[dependencies]
summdb-core = { path = "../summdb-core" }
summdb-storage = { path = "../summdb-storage" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
